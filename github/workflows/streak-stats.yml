name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at 00:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # user is pulled automatically from the repo owner, so this
          # workflow works as-is without hardcoding your username
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: assets/streak-stats.svg
          # Use secrets.STREAK_TOKEN instead if you added a PAT to count
          # private contributions (see setup notes).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if the file changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats [automated]"
          git push
